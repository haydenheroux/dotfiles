# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = """
$jobs\
$git_branch\
$directory
"""

palette = "catppuccin_macchiato"

[jobs]
symbol = "󰒲"
style="bold green"

[git_branch]
style = "bold mauve"
format ="[$symbol$branch(:$remote_branch)]($style) "

[directory]
truncation_length = 4
truncation_symbol = '…/'
style = "bold blue"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
